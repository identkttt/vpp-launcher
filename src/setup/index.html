<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' file: data:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'">
<title>Vanilla++ — установка</title>
<link rel="stylesheet" href="../renderer/fonts.css">
<link rel="stylesheet" href="setup.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24"><path d="M19 13H5v-2h14v2z"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></symbol>
  </defs>
</svg>

<div class="stage">
  <div class="window" id="win">
    <div class="backdrop">
      <img class="pano" id="pano" alt="">
      <div class="shade"></div>
      <div class="shade deep"></div>
    </div>

    <div class="titlebar">
      <span class="proto" id="titleVer">Vanilla++</span>
      <div class="controls">
        <button class="ctl" id="min" title="Свернуть"><svg><use href="#i-minus"/></svg></button>
        <button class="ctl close" id="close" title="Закрыть"><svg><use href="#i-close"/></svg></button>
      </div>
    </div>

    <main class="panel glass">
      <div class="brand">
        <div class="logo" id="logo"></div>
        <div>
          <div class="caps">Установка</div>
          <h1>Vanilla++</h1>
        </div>
      </div>

      <label class="field">
        <span class="label">Папка установки</span>
        <div class="path-row">
          <input id="dir" spellcheck="false" autocomplete="off">
          <button class="btn wash" id="browse"><svg class="ic"><use href="#i-folder"/></svg>Обзор</button>
        </div>
      </label>

      <div class="checks">
        <label class="check"><input type="checkbox" id="desktop" checked><span>Ярлык на рабочем столе</span></label>
        <label class="check"><input type="checkbox" id="startMenu" checked><span>В меню Пуск</span></label>
      </div>

      <div class="progress" id="progress" hidden>
        <div class="bar"><div class="fill" id="fill"></div></div>
        <div class="prog-text" id="progText">Устанавливаем…</div>
      </div>

      <div class="actions">
        <button class="btn wash" id="cancel">Отмена</button>
        <button class="btn primary" id="install"><svg class="ic"><use href="#i-download"/></svg><span id="installLabel">Установить</span></button>
      </div>
      <div class="err" id="err"></div>
    </main>
  </div>
</div>

<script src="setup.js"></script>
</body>
</html>
